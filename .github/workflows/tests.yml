name: EduPresence tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run test suite
        env:
          AUTH_REQUIRED: "false"
          AUTO_SEED_DEMO: "false"
          DATABASE_URL: "sqlite:///${{ runner.temp }}/edupresence-ci.db"
          L2E_ENABLED: "false"
          SMS_PROVIDER: mock
        run: python -m pytest -q
